# ═══════════════════════════════════════════════════════════════════
# 术语表（保持全文一致）
# pane 窗格 / tab 标签页 / session 会话 / floating 浮动 / embed 嵌入
# stacked 堆叠 / fullscreen 全屏 / focus 焦点 / lock 锁定 / unlock 解锁
# resize 调整大小 / move 移动 / search 搜索 / scroll 滚动
# scrollback 回滚缓冲区 / detach 断开 / quit 退出 / rename 重命名
# split 拆分 / layout 布局 / plugin 插件 / settings 设置
# desktop entry 桌面入口 / clipboard 剪贴板 / inbox 收件箱 / sync 同步 / break pane 拆出窗格
# case sensitive 区分大小写 / whole word 整词 / wrap 循环 / select 选择
# 风格：简洁 UI 中文；短标签不加句号；省略号用 "……"；键名/修饰键
# （Ctrl、Alt、Shift、ESC、TAB、方向键）与 "Zellij"、"TMUX" 不译。
# ═══════════════════════════════════════════════════════════════════

# zellij-zh-cn 集中译文目录：键 = 英文原文，值 = 简体中文。
# 键必须与补丁中 tr("...") / t("...") 的参数逐字一致（含大小写、标点）。
# 带参数的文字使用 {name} 占位符，键和值中的占位符集合必须一致。

