name: release

# 为各平台构建汉化版并打包。沿用上游发布流程的目标与构建方式
# （Linux musl 与 macOS 用 `cargo xtask ci cross`，Windows 原生构建并静态链接 CRT）。
#
# - 手动运行（workflow_dispatch）：构建并上传为工作流产物，用于试跑。
# - 填写 tag 输入（如 v0.46.0-zh.2）时，构建完成后创建**草稿** Release，由人工核对说明后再发布。
#   不再在推送 tag 时自动触发：这样补发/改说明时不会白白重编一遍。
# 各平台的验证程度不同，请在发布说明里如实写明。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "要创建草稿 Release 的 tag（留空则只构建、不发布）"
        required: false
        default: ""

permissions:
  contents: read

env:
  PYTHON: python

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tool unit tests
        run: python -m unittest discover -s tools/tests -v
      - name: fetch upstream baseline
        run: python tools/zhcn.py fetch
      - name: check (baseline + patches + catalog)
        run: python tools/zhcn.py check

  build:
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows 暂不提供：构建在 OpenSSL 等依赖处反复失败且无法在本地验证，计划以后再处理。
          # （tools/zhcn.py 的 --target 仍保留 Windows 分支，未经验证。）
    defaults:
      run:
        shell: bash
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install musl-tools
        if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends musl-tools
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-wasip1,${{ matrix.target }}
      - name: work directory (short path on Windows; upstream has very long file names)
        run: |
          git config --global core.longpaths true
          git config --global core.autocrlf false
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "ZWD=${RUNNER_TEMP}/z" >> "$GITHUB_ENV"
          else
            echo "ZWD=${GITHUB_WORKSPACE}/.work/zellij" >> "$GITHUB_ENV"
          fi
      - name: fetch upstream baseline
        run: python tools/zhcn.py fetch --workdir "$ZWD"
      - name: build localized binary
        run: |
          # Windows: OpenSSL is built from source and needs a full perl. Git Bash's bundled
          # perl lacks modules; the runner's Strawberry Perl (what upstream's PowerShell
          # steps use) works.
          if [ "$RUNNER_OS" = "Windows" ]; then
            export PATH="/c/Strawberry/perl/bin:/c/Strawberry/c/bin:$PATH"
            perl -v | head -2
          fi
          python tools/zhcn.py build --target ${{ matrix.target }} --workdir "$ZWD"
      - name: package
        run: python tools/zhcn.py package --target ${{ matrix.target }} --workdir "$ZWD" --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: zellij-zh-${{ matrix.target }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  release:
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: list assets
        run: ls -la dist
      - name: create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Zellij 简体中文 ${{ inputs.tag }}" \
            --notes-file .github/release-notes.md
